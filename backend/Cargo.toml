[package]
name = "realtime-leaderboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Real-time leaderboard API backed by PostgreSQL and Redis"
license = "MIT"
# The crate ships three binaries (`openapi`, `rebuild`, and this API), so a bare
# `cargo run` has no unambiguous target. Naming the API here keeps the documented
# `cargo run` (AGENTS.md, the dev-sandbox entrypoint) working without `--bin`.
default-run = "realtime-leaderboard"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "uuid",
] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }
utoipa = { version = "5.5.0", features = ["uuid"] }
# Newest Swagger UI that builds on the pinned 1.83 toolchain. Its `rust-embed
# 8.13` transitive needs `sha2 0.11` (Rust 1.85+), so Cargo.lock holds the
# rust-embed/-utils/-impl trio at 8.11.0 (`sha2 ^0.10`). Do not let a lockfile
# update raise those past 8.11.x without re-checking `rust-version = "1.83"`
# (the CI `msrv` job builds with 1.83.0 to catch exactly that). `vendored`
# embeds the Swagger UI dist instead of downloading it in the build script, so
# builds stay hermetic/offline like the committed `.sqlx/` cache.
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
