[package]
name = "realtime-leaderboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Real-time leaderboard API backed by PostgreSQL and Redis"
license = "MIT"
# The crate ships three binaries (`openapi`, `rebuild`, and this API), so a bare
# `cargo run` has no unambiguous target. Naming the API here keeps the documented
# `cargo run` (AGENTS.md, the dev-sandbox entrypoint) working without `--bin`.
default-run = "realtime-leaderboard"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "uuid",
] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7", features = ["trace"] }
utoipa = { version = "5.5.0", features = ["uuid"] }
# Swagger UI. Under the old 1.83 MSRV, Cargo.lock held the `rust-embed`/
# `-utils`/`-impl` trio at 8.11.0 (`sha2 ^0.10`) because 8.13's `sha2 0.11`
# needs Rust 1.85+. With the pin now at 1.94 that hold is no longer required and
# the trio may move (the utoipa-swagger-ui 10 bump does exactly that). The CI
# `msrv` job still builds with the pinned toolchain to fail fast if a lockfile
# update raises a dependency past `rust-version = "1.94"`. `vendored` embeds the
# Swagger UI dist instead of downloading it in the build script, so builds stay
# hermetic/offline like the committed `.sqlx/` cache.
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
